<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tagihan Hutang</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6366f1"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tagihan">
<style>
:root{--bg:#f5f6fc;--card:#fff;--tx:#1b1d2a;--mu:#7a7f94;--ln:#eceef6;--hot:#f43f5e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1020;--card:#181a2e;--tx:#f1f2fa;--mu:#9094ad;--ln:#272a45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1020;--card:#181a2e;--tx:#f1f2fa;--mu:#9094ad;--ln:#272a45;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 110px}
button{font:inherit;color:inherit;cursor:pointer}
.top{font-size:13px;color:var(--mu);margin:2px 4px 12px;font-weight:500}
.top b{color:var(--tx);font-size:20px;display:block;letter-spacing:-.01em}
.hero{background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#ec4899);color:#fff;border-radius:24px;padding:22px 20px 18px;box-shadow:0 14px 34px -14px #7c5cf0aa;animation:up .5s both}
.hero small{opacity:.8;font-size:13px}
.big{font-size:36px;font-weight:700;letter-spacing:-.025em;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.hb{height:8px;background:#ffffff40;border-radius:9px;overflow:hidden}
.hb i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.st{display:flex;gap:8px;margin-top:14px}
.st div{flex:1;background:#ffffff26;border-radius:14px;padding:9px 11px}
.st small{display:block;font-size:11px}.st b{font-size:13.5px;font-variant-numeric:tabular-nums}
h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:24px 4px 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px 13px;min-width:132px;transition:transform .15s,box-shadow .2s;border-left:4px solid var(--c)}
.chip:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px #0003}
.chip:active{transform:scale(.97)}
.chip small{display:block;color:var(--mu);font-size:12px}.chip b{display:block;font-size:14px;margin-top:2px}
.chip.hot small{color:var(--hot);font-weight:600}
.seg{display:flex;background:var(--ln);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:8px 4px;font-size:13.5px;font-weight:500;color:var(--mu);transition:background .25s,color .25s,box-shadow .25s}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 8px -3px #0003}
#list{margin-top:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;margin-bottom:10px;overflow:hidden;transition:box-shadow .25s,transform .25s}
.card.enter{animation:up .45s both}
.card.open{box-shadow:0 14px 28px -18px color-mix(in srgb,var(--c) 70%,transparent)}
.card.flash{animation:fl 1s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
header{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--card));flex:none}
.mid{flex:1;min-width:0}.mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{color:var(--mu);font-size:12.5px}
.rt{text-align:right;display:flex;align-items:center;gap:6px}
.rt strong{font-size:14.5px;font-variant-numeric:tabular-nums}
.rt strong.ok{color:#10b981}
.rt svg{width:16px;height:16px;color:var(--mu);transition:transform .3s}
.open .rt svg{transform:rotate(180deg)}
.pb{height:4px;background:var(--ln)}.pb i{display:block;height:100%;width:0;background:var(--c);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.open .wrap{grid-template-rows:1fr}
.in{overflow:hidden;min-height:0}
.pad{padding:6px 14px 14px}
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:12px;cursor:pointer;transition:background .15s}
.row:hover{background:color-mix(in srgb,var(--c) 8%,var(--card))}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s}
.ck svg{width:13px;height:13px;color:#fff;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.row.p .ck{background:var(--c);border-color:var(--c)}.row.p .ck svg{transform:scale(1)}
.l{flex:1;transition:color .2s}.a{font-variant-numeric:tabular-nums;font-weight:500;transition:color .2s}
.row.p .l,.row.p .a{color:var(--mu);text-decoration:line-through}
.x{border:0;background:none;color:var(--mu);font-size:18px;line-height:1;opacity:0;transition:opacity .15s,color .15s;padding:2px 6px}
.row:hover .x,.row:focus-within .x{opacity:1}.x:hover{color:var(--hot)}
@media (hover:none){.x{opacity:.5}}
.add{display:flex;gap:6px;margin-top:8px}
input{flex:1;min-width:0;background:var(--bg);color:var(--tx);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;font:inherit;outline:0;transition:border-color .2s}
input:focus{border-color:var(--c,#6366f1)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;color:#fff;background:var(--c,#6366f1);transition:transform .12s,filter .2s}
.btn:active{transform:scale(.95)}.btn:hover{filter:brightness(1.08)}
.acts{display:flex;justify-content:space-between;margin-top:8px}
.ln{border:0;background:none;font-size:12.5px;color:var(--mu);padding:6px 4px;transition:color .15s}
.ln:hover{color:var(--c)}.ln.d:hover{color:var(--hot)}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;font-size:28px;box-shadow:0 12px 24px -8px #7c5cf0cc;transition:transform .2s}
.fab:hover{transform:rotate(90deg) scale(1.06)}.fab:active{transform:scale(.92)}
.ov{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .25s,visibility 0s .25s;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.ov.on{opacity:1;pointer-events:auto;visibility:visible;transition-delay:0s}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.on .sheet{transform:none}
.sheet h3{margin:0 0 14px;font-size:17px}.sheet .add{margin:0 0 14px}.sheet .btn{width:100%}
.rs{display:block;margin:26px auto 0;border:0;background:none;color:var(--mu);font-size:12px}
main{padding-bottom:130px}
button,.row,header,.chip{touch-action:manipulation}
input{font-size:16px}
header{padding:16px 14px}
.row{padding:12px 6px;min-height:52px}
.ck{width:26px;height:26px}
.x{font-size:22px;padding:8px 12px;margin:-8px -6px}
.ln{padding:12px 6px}
.chip{min-width:140px;padding:12px 14px}
.btn{min-height:46px}
.big{font-size:clamp(28px,8.5vw,36px)}
.st b{font-size:13px}
.bar{position:fixed;top:0;left:0;right:0;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);transform:translateY(-110%);transition:transform .3s;font-size:13px;color:var(--mu)}
.bar b{color:var(--tx);font-size:16px;font-variant-numeric:tabular-nums}
.bar.on{transform:none}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;gap:10px;align-items:center;max-width:560px;margin:0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.dock .seg{flex:1;background:var(--card);border:1px solid var(--ln);box-shadow:0 6px 18px -12px #0005}
.dock .seg button{padding:11px 2px;font-size:13px;white-space:nowrap}
.dock .seg button.on{background:#6366f1;color:#fff;box-shadow:none}
.dock .fab{position:static;width:50px;height:50px;font-size:26px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);background:var(--tx);color:var(--bg);padding:8px 8px 8px 16px;border-radius:14px;font-size:14px;opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{border:0;background:#8887;color:inherit;border-radius:10px;padding:9px 12px;font-weight:600;flex:none}
.ft{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:26px}.ft button{border:0;background:var(--ln);color:var(--mu);border-radius:10px;padding:10px 12px;font-size:12.5px}
.warn{display:none;background:#f43f5e22;color:var(--hot);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="bar" id="bar" onclick="scrollTo({top:0})"><span>Sisa tagihan</span><b id="bb"></b></div><main>
<div class="top">Halo 👋<b>Tagihan Hutang</b></div>
<section class="hero"><small>Sisa yang harus dibayar</small><div class="big" id="big">Rp 0</div>
<div class="hb"><i id="hp"></i></div>
<div class="st"><div><small>Terbayar</small><b id="s1"></b></div><div><small>Total</small><b id="s2"></b></div><div><small>Lunas</small><b id="s3"></b></div></div></section>
<div class="warn" id="warn">⚠ Penyimpanan browser tidak aktif (mode privat?). Data tidak akan tersimpan, gunakan Simpan cadangan.</div>
<div id="up"></div>
<h2>Semua hutang</h2>
<div id="list"></div>
<div class="ft"><button onclick="backup()">⬇ Simpan cadangan</button><button onclick="document.getElementById('im').click()">⬆ Pulihkan</button><button onclick="resetAll()">Data awal</button><input type="file" id="im" accept=".json,application/json" hidden onchange="restore(this)"></div>
</main>
<nav class="dock"><div class="seg" id="seg"></div><button class="fab" onclick="sheet(1)" aria-label="Tambah hutang">+</button></nav>
<div class="toast" id="tt"><span id="tm"></span><button onclick="undo()">Urungkan</button></div>
<div class="ov" id="ov" onclick="if(event.target===this)sheet(0)"><div class="sheet"><h3>Hutang baru</h3>
<div class="add"><input type="text" id="nn" placeholder="Nama, mis. Kredivo"><input type="number" id="nd" placeholder="Tgl" style="max-width:80px" min="1" max="31"></div>
<button class="btn" onclick="addDebt()">Simpan</button></div></div>
<script>
const seed=()=>[
{n:"Adapundi",d:"7 & 12",i:[["Okt",1195022],["Nov",1055391],["Des",1787069],["Jan",1787069],["Feb",1787069],["Mar",1169532],["Apr",937865],["Mei",937865],["Jun",937865],["Jul",937865]]},
{n:"Kredivo",d:"25",i:["Okt","Nov","Des","Jan","Feb","Mar","Apr","Mei","Jun"].map(b=>[b,5461720])},
{n:"Gopay BPKB",d:"18",i:Array.from({length:12},(_,k)=>["Cicilan "+(k+1),4329000])},
{n:"Akulaku",d:"25",i:[["Tagihan terakhir (25/10)",636268]]},
{n:"Gopay Pinjam",d:"Tiap bulan",i:[["Okt",6522500],["Nov",3594766],["Des",3594763],["Jan",3331179],["Feb",1189446],["Mar",246263],["Apr",246263],["Mei",246263]]},
{n:"ShopeePay Pinjam",d:"1",i:[["Okt",522455],["Nov",497576],["Des",497576],["Jan",497576],["Feb",497576]]},
{n:"SPay Pinjam (2)",d:"1",i:[["Okt",355866],["Nov",338920],["Des",338920],["Jan",338920],["Feb",338920],["Mar",338920]]},
{n:"SpayLater",d:"25",i:[["Okt",462019],["Nov",417575],["Des",845827],["Jan",687015],["Feb",577998],["Mar",350175],["Apr",275387],["Mei",257317],["Jun",231449],["Jul",138955],["Agu",93979]]},



{n:"Gopay Later",d:"2 tagihan",i:[["Sep",845440],["Nov",647408]]}
].map(x=>({n:x.n,d:x.d,open:0,i:x.i.map(([l,a])=>({l,a,p:0}))}));
let S;try{S=JSON.parse(localStorage.getItem("tagihan1"))}catch(e){}
if(!Array.isArray(S))S=seed();
function norm(a){return a.filter(c=>c&&typeof c.n=="string"&&Array.isArray(c.i)).map(c=>({n:c.n,d:String(c.d??"-"),open:c.open?1:0,i:c.i.filter(x=>x&&+x.a>0).map(x=>({l:String(x.l),a:+x.a,p:x.p?1:0}))}))}
S=norm(S);
try{if(!localStorage.getItem("tg_m2")){S=S.filter(c=>!/^think yup/i.test(c.n));const k=S.find(c=>c.n=="Kredivo");if(k&&k.i.length==1){const p=k.i[0].p;k.i=seed().find(c=>c.n=="Kredivo").i;k.i[0].p=p}localStorage.setItem("tg_m2","1");save()}}catch(e){}
let F="all",first=1,shown=0,raf=0,undoS=null,tmr=0;
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem("tagihan1",JSON.stringify(S))}catch(e){}};
const rp=n=>"Rp "+Math.round(n).toLocaleString("id-ID");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL=["#6366f1","#ec4899","#f59e0b","#10b981","#0ea5e9","#8b5cf6","#f43f5e","#14b8a6"];
const col=n=>COL[[...n].reduce((h,c)=>h+c.charCodeAt(0),0)%COL.length];
const tot=c=>c.i.reduce((s,x)=>s+x.a,0), pd=c=>c.i.reduce((s,x)=>s+(x.p?x.a:0),0);
const isDone=c=>c.i.length>0&&tot(c)-pd(c)<=0;
const CK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
const CH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function due(c){if(!/^[\d\s&,]+$/.test(c.d))return null;const ns=(c.d.match(/\d+/g)||[]).map(Number).filter(n=>n>=1&&n<=31);if(!ns.length)return null;const t=new Date().getDate();return Math.min(...ns.map(n=>n>=t?n-t:n-t+30))}
function countTo(v){cancelAnimationFrame(raf);const s=shown,t=performance.now();const f=n=>{const k=Math.min(1,(n-t)/600);shown=s+(v-s)*(1-Math.pow(1-k,3));$("big").textContent=rp(shown);if(k<1)raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
function build(){
 const vis=S.map((c,ci)=>[c,ci]).filter(([c])=>F=="all"||(F=="open")!==isDone(c));
 $("list").innerHTML=vis.length?vis.map(([c,ci],k)=>`<section class="card ${c.open?'open':''} ${first?'enter':''}" id="c${ci}" style="--c:${col(c.n)};animation-delay:${k*45}ms">
 <header onclick="tg(${ci})"><div class="av">${esc(c.n[0]||"?").toUpperCase()}</div><div class="mid"><b>${esc(c.n)}</b><small id="s${ci}"></small></div><div class="rt"><strong id="r${ci}"></strong>${CH}</div></header>
 <div class="pb"><i id="p${ci}"></i></div>
 <div class="wrap"><div class="in"><div class="pad">${c.i.map((x,xi)=>`<div class="row" id="w${ci}_${xi}" onclick="pk(${ci},${xi})"><span class="ck">${CK}</span><span class="l">${esc(x.l)}</span><span class="a">${rp(x.a)}</span><button class="x" onclick="event.stopPropagation();dl(${ci},${xi})" aria-label="Hapus">×</button></div>`).join("")}
 <div class="add"><input type="text" id="l${ci}" placeholder="Bulan"><input type="number" id="a${ci}" placeholder="Nominal" onkeydown="if(event.key=='Enter')ai(${ci})"><button class="btn" onclick="ai(${ci})">+</button></div>
 <div class="acts"><button class="ln" id="m${ci}" onclick="ma(${ci})"></button><button class="ln d" onclick="dd(${ci})">Hapus hutang</button></div></div></div></div></section>`).join(""):'<div class="empty">Tidak ada yang cocok 🎉</div>';
 first=0;refresh();
}
function refresh(){
 let T=0,P=0,L=0;
 S.forEach((c,ci)=>{const t=tot(c),p=pd(c),l=t-p,n=c.i.filter(x=>x.p).length;T+=t;P+=p;if(isDone(c))L++;
  if(!$("c"+ci))return;
  $("s"+ci).textContent=`Tgl ${c.d} · ${n}/${c.i.length} lunas`;
  const r=$("r"+ci);const dn=isDone(c);r.textContent=dn?"Lunas ✓":rp(l);r.className=dn?"ok":"";
  $("p"+ci).style.width=(t?p/t*100:0)+"%";
  $("m"+ci).textContent=dn?"Batalkan semua":"Tandai semua lunas";
  c.i.forEach((x,xi)=>$(`w${ci}_${xi}`).classList.toggle("p",!!x.p))});
 countTo(T-P);$("hp").style.width=(T?P/T*100:0)+"%";
 $("s1").textContent=sh(P);$("s2").textContent=sh(T);$("bb").textContent=rp(T-P);$("s3").textContent=L+"/"+S.length;
 const cnt={all:S.length,open:S.length-L,done:L};
 $("seg").innerHTML=[["all","Semua"],["open","Belum"],["done","Lunas"]].map(([k,n])=>`<button class="${F==k?'on':''}" onclick="flt('${k}')">${n} · ${cnt[k]}</button>`).join("");
 const u=S.map((c,ci)=>({c,ci,d:due(c),x:c.i.find(x=>!x.p)})).filter(o=>o.d!==null&&o.x).sort((a,b)=>a.d-b.d).slice(0,6);
 $("up").innerHTML=u.length?`<h2>Jatuh tempo terdekat</h2><div class="chips">${u.map(o=>`<button class="chip ${o.d<=3?'hot':''}" style="--c:${col(o.c.n)}" onclick="go(${o.ci})"><small>${o.d==0?"Hari ini":o.d==1?"Besok":o.d+" hari lagi"}</small><b>${esc(o.c.n)}</b><small>${rp(o.x.a)}</small></button>`).join("")}</div>`:"";
}
const up=()=>{save();build()};
function tg(c){S[c].open=S[c].open?0:1;$("c"+c).classList.toggle("open",!!S[c].open);save()}
function pk(c,x){S[c].i[x].p=S[c].i[x].p?0:1;save();refresh()}
function ma(c){const all=S[c].i.every(x=>x.p);S[c].i.forEach(x=>x.p=all?0:1);save();refresh()}
function dl(c,x){snap("Tagihan dihapus");S[c].i.splice(x,1);up()}
function dd(c){snap(S[c].n+" dihapus");S.splice(c,1);up()}
function ai(c){const l=$("l"+c).value.trim(),a=+$("a"+c).value;if(!l||!(a>0))return;S[c].i.push({l,a,p:0});up();const e=$("l"+c);if(e)e.focus()}
function flt(k){F=k;first=1;build()}
function go(ci){if(!$("c"+ci)){F="all";build()}S[ci].open=1;save();const e=$("c"+ci);e.classList.add("open");e.scrollIntoView({behavior:"smooth",block:"center"});e.style.animationDelay="0ms";e.classList.remove("flash");void e.offsetWidth;e.classList.add("flash")}
function sheet(o){$("ov").classList.toggle("on",!!o);if(o)setTimeout(()=>$("nn").focus(),300)}
function addDebt(){const n=$("nn").value.trim();if(!n)return;S.push({n,d:(+$("nd").value>=1&&+$("nd").value<=31)?String(Math.round(+$("nd").value)):"-",open:1,i:[]});$("nn").value="";$("nd").value="";sheet(0);up();setTimeout(()=>go(S.length-1),50)}
function resetAll(){snap("Data dikembalikan ke awal");S=seed();first=1;up()}
function snap(m){undoS=JSON.stringify(S);$("tm").textContent=m;$("tt").classList.add("on");clearTimeout(tmr);tmr=setTimeout(()=>$("tt").classList.remove("on"),6000)}
